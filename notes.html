<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter notes · SNITCH AI Studio</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/style.css?v=57">
<style>
  body{display:block;padding:32px var(--gutter);max-width:900px;margin:0 auto}
  .sc{border-top:1px solid var(--line);padding:28px 0;break-inside:avoid}
  .sc h2{margin-bottom:4px} .sc h3{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}
  .sc p,.sc li{font-size:.95rem} .sc ul{margin:0;padding-left:18px} .tag{font-size:.8125rem;color:var(--ink-3)}
  @media print{ body{padding:0} .sc{page-break-inside:avoid} a{color:inherit} }
</style>
</head>
<body>
<h1>Presenter notes</h1>
<p class="muted">One block per scene: key message, the full script, evidence with its source file, technical context, implementation considerations, and likely questions. Print with ⌘P.</p>
<div id="out"></div>
<script src="assets/scenes.js?v=57"></script>
<script src="assets/scenes-short.js?v=57"></script>
<script src="assets/editions.js?v=57"></script>
<script>
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CH = { 0:'Start',1:'Create',2:'Learn',3:'Distribute',4:'Imagine + pilot' };
  const BADGE = { built: 'Built & tested', prototype: 'Prototype', access: 'Needs SNITCH access', experimental: 'Experimental' };
  document.getElementById('out').innerHTML = window.PITCH_SCENES.map((s, i) => `<section class="sc">
    <div class="tag">${i + 1} / ${window.PITCH_SCENES.length} · ${esc(CH[s.chapter])}${s.badge ? ` · <span class="badge ${s.badge}">${BADGE[s.badge]}</span>` : ''}${s.duration ? ` · narration ${Math.round(s.duration)} s` : ''}</div>
    <h2>${esc(s.title)}</h2>
    <h3>Key message</h3><p>${esc(s.notes.key)}</p>
    <h3>Script</h3>${s.narration.map(n => `<p>${esc(n.text)}</p>`).join('')}
    <h3>Evidence</h3><ul>${s.evidence.map(e => `<li><b>${esc(e.claim)}</b> — <span class="src">${esc(e.source)}</span> — ${esc(e.value)}</li>`).join('')}</ul>
    <h3>Technical context</h3><p>${esc(s.notes.technical)}</p>
    <h3>Implementation considerations</h3><p>${esc(s.notes.implementation)}</p>
    <h3>Likely questions</h3>${s.notes.questions.map(q => `<p><b>${esc(q.q)}</b><br>${esc(q.a)}</p>`).join('')}
  </section>`).join('');
</script>
</body>
</html>
